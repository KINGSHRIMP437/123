name: Python-Test
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'  # Specify your desired Python version here

      - name: Run unit tests
        run: |
          if find . -maxdepth 1 -name "test_*.py" | grep -q .; then
            python -m unittest discover -s . -p "test_*.py"
          else
            echo "No unit tests found matching test_*.py; skipping."
          fi
